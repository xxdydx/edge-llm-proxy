apiVersion: flowmesh/v1
kind: SSHTask
metadata:
  name: arul-edge-client-dev
  annotations:
    description: Development environment for the edge LLM client project

spec:
  taskType: ssh
  interactive: true
  user: flowmesh
  # Pinned by digest, not by tag. A digest is the image's content hash, so there
  # is no tag indirection and no chance of a worker serving a cached older build
  # under the same name. Update this whenever the image is rebuilt.
  # Built from commit d4f1f6f — linux/amd64, includes build-essential for Triton.
  image: ghcr.io/xxdydx/edge-llm-dev@sha256:76dcb3f8fbe8e372a0f0d2588f66a1fae9d12986925622229da09bd3c67b3060
  authorizedKeys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFtYUOhUWEINIqO6vSah1/v+c//g0Hd6aqO1CM55twi9 official@arul.me
  resources:
    hardware:
      gpu:
        type: RTX 5080
        count: 1
      cpu: 8
      memory: 32Gi
  ttlSeconds: 28800
  accessMode: forward
  output:
    destination:
      type: http

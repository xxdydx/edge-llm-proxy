[project]
name = "edgeproxy"
version = "0.1.0"
description = "Recording pass-through proxy for Anthropic-compatible endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "nvidia-ml-py>=12.560.30",
]

[project.scripts]
edgeproxy = "edgeproxy.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgeproxy"]

[tool.ruff]
line-length = 100
